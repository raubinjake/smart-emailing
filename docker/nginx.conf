# Nginx fronting PHP-FPM. Railway routes to $PORT, which the entrypoint
# substitutes into this file at boot.

user www-data;
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    # Must clear the 10 MB the upload form accepts.
    client_max_body_size 16M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Writable paths for a non-root worker process.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    server {
        listen __PORT__;
        server_name _;
        root /var/www/html/public;
        index index.php;

        charset utf-8;

        # Vendored TinyMCE and the stylesheet are immutable per deploy.
        location ~* \.(css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
            expires 30d;
            access_log off;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;

            # A 10k-row file parses synchronously inside the request.
            fastcgi_read_timeout 120;
        }

        # Never serve the dotfiles that sit alongside the app.
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
